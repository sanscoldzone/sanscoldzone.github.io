<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="intro.css" rel="stylesheet">
        <link rel="icon" type="image/png" href="immagini/icon.png">
        <title>The Bay Harbour Site - Intro</title>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9515995415757323"
     crossorigin="anonymous"></script>
    </head>
    <body>
        <div id="intro-container" class="center-wrapper">
            <h1 class="fade-text">Tonight's the night.</h1>
            <button id="start-btn">Inizia l'esperienza</button>
        </div>
        <audio id="dexter-audio" src="audio/tonight-the-night-voice.mp3"></audio>

        <script>
            const btn = document.getElementById('start-btn');
            const text = document.querySelector('.fade-text');
            const audio = document.getElementById('dexter-audio');

            btn.addEventListener('click', () => {
                
                btn.style.display = 'none';
                
            
                text.style.opacity = '1';
                
                
                audio.play();

            
                setTimeout(() => {
                    window.location.href = "pagine/home.html";
                }, 4000); 
            });
        </script>
    </body>

</html>
